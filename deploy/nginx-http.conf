# Optional proxy: first change Python service to 127.0.0.1:8080.
# Do not load alongside another server listening on the same port/name.
server {
    listen 80;
    server_name 10.20.10.50;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
