
# 1. Cổng 80 (HTTP):
#    - GIỮ NGUYÊN đường dẫn /demo/ids-probe chạy HTTP thuần để Suricata IDS (VLAN 20)
#      đọc được chuỗi "HICP-IDS-TEST" và kích hoạt cảnh báo SID 1001001.
#    - Tự động chuyển hướng (301 Redirect) toàn bộ truy cập Bệnh viện sang HTTPS (443).
server {
    listen 80;
    server_name 10.20.10.50 medicare.local _;

    location = /demo/ids-probe {
        proxy_pass http://127.0.0.1:8080/demo/ids-probe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Cổng 443 (HTTPS) - Ứng dụng Bệnh viện MediCare (HICP EHR)
server {
    listen 443 ssl http2;
    server_name 10.20.10.50 medicare.local;

    ssl_certificate     /etc/hicp-tls/server.crt;
    ssl_certificate_key /etc/hicp-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Client-MAC $http_x_client_mac;
    }
}

# 3. Cổng 8443 (hoặc Subdomain siem.medicare.local trên cổng 443) - Wazuh SIEM Dashboard
#    (Sau khi chuyển Wazuh Dashboard sang lắng nghe nội bộ tại 127.0.0.1:5601)
server {
    listen 443 ssl http2;
    listen 8443 ssl http2;
    server_name siem.medicare.local;

    ssl_certificate     /etc/hicp-tls/server.crt;
    ssl_certificate_key /etc/hicp-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://127.0.0.1:5601;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
